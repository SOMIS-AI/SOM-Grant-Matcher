name: Build and Deploy to Azure Web App

on:
  push:
    # NOTE: `main` is intentionally NOT auto-triggered. It is a stale branch kept
    # only as an emergency fallback (old code). Auto-building it would publish a
    # :latest image from outdated code and could overwrite production. If a
    # fallback build from `main` is ever genuinely needed, run this workflow
    # manually via "Run workflow" (workflow_dispatch) and select the `main` branch.
    branches:
      - azure          # production → builds :latest
      - dev            # development → builds :dev
  workflow_dispatch:

env:
  IMAGE_NAME: som-grant-matcher
  OWNER: somis-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image tag
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ── Deploy ──────────────────────────────────────────────────────────────
      # Pushing the image is NOT a deploy: the Web App keeps serving the old
      # container until something tells it to pull the new one. Until this step
      # existed, every green run still needed a manual restart in the Azure
      # portal before the change reached users (confirmed 2026-08-07).
      #
      # Only `azure` (production, :latest) deploys. `dev` builds :dev for manual
      # promotion — give it its own Web App and copy this block if that changes.
      #
      # CURRENT STATE (decided 2026-08-07): automatic deploy is intentionally
      # OFF. The Web App has SCM Basic Auth Publishing Credentials disabled — the
      # Azure default — so no publish profile can be issued, and we chose not to
      # re-enable it or to store any Azure credential in GitHub. Deploying stays
      # a deliberate manual act: restart the Web App to pick up a build.
      #
      # So these steps skip, loudly, rather than fail. The warning is the point:
      # the old failure mode was a green check that silently meant nothing had
      # shipped. To turn automatic deploys on later, either set up an OIDC
      # federated credential (preferred — no stored secret, works with basic
      # auth disabled) and swap in azure/login@v2, or re-enable basic auth and
      # supply:
      #   secret   AZURE_WEBAPP_PUBLISH_PROFILE  — the Web App's publish profile
      #   variable AZURE_WEBAPP_NAME             — e.g. som-grant-matcher
      - name: Check Azure deploy configuration
        id: azcfg
        if: github.ref_name == 'azure'
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -n "$WEBAPP_NAME" ] && [ -n "$PUBLISH_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy image to Azure Web App
        if: github.ref_name == 'azure' && steps.azcfg.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Report image published, restart required
        if: github.ref_name == 'azure' && steps.azcfg.outputs.ready != 'true'
        run: |
          echo "::warning title=Image published — restart the Web App to deploy it::Automatic deploy is intentionally off (no Azure credentials are stored). This build is NOT live until the Azure Web App is restarted."
          {
            echo "### 📦 Image published — restart required to go live"
            echo ""
            echo "\`${IMAGE_REF}\` was built and pushed successfully."
            echo ""
            echo "**This build is not live yet.** Automatic deploy is intentionally"
            echo "disabled: the Web App has basic auth publishing turned off and this"
            echo "repo stores no Azure credentials, so publishing an image and"
            echo "deploying it are separate acts."
            echo ""
            echo "To ship it: **Azure Portal → the Web App → Restart.**"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_REF: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
