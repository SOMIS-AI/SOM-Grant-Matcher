name: Build and Deploy to Azure Web App

on:
  push:
    # NOTE: `main` is intentionally NOT auto-triggered. It is a stale branch kept
    # only as an emergency fallback (old code). Auto-building it would publish a
    # :latest image from outdated code and could overwrite production. If a
    # fallback build from `main` is ever genuinely needed, run this workflow
    # manually via "Run workflow" (workflow_dispatch) and select the `main` branch.
    branches:
      - azure          # production → builds :latest
      - dev            # development → builds :dev
  workflow_dispatch:

env:
  IMAGE_NAME: som-grant-matcher
  OWNER: somis-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image tag
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ── Deploy ──────────────────────────────────────────────────────────────
      # Pushing the image is NOT a deploy: the Web App keeps serving the old
      # container until something tells it to pull the new one. Until this step
      # existed, every green run still needed a manual restart in the Azure
      # portal before the change reached users (confirmed 2026-08-07).
      #
      # Only `azure` (production, :latest) deploys. `dev` builds :dev for manual
      # promotion — give it its own Web App and copy this block if that changes.
      #
      # Requires, per AZURE_SETUP_GUIDE.md PART 4 Step 2:
      #   secret   AZURE_WEBAPP_PUBLISH_PROFILE  — the Web App's publish profile
      #   variable AZURE_WEBAPP_NAME             — e.g. som-grant-matcher
      # Neither was set when this step was added, so it SKIPS rather than fails
      # when they're absent: an unconfigured repo keeps building as before
      # instead of turning every push red. The skip is loud on purpose — a green
      # run with the warning below still means "not deployed".
      - name: Check Azure deploy configuration
        id: azcfg
        if: github.ref_name == 'azure'
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -n "$WEBAPP_NAME" ] && [ -n "$PUBLISH_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy image to Azure Web App
        if: github.ref_name == 'azure' && steps.azcfg.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Report deploy skipped
        if: github.ref_name == 'azure' && steps.azcfg.outputs.ready != 'true'
        run: |
          echo "::warning title=Image published but NOT deployed::AZURE_WEBAPP_NAME and/or AZURE_WEBAPP_PUBLISH_PROFILE are not configured, so the Web App was not updated. Restart it manually in the Azure portal, or add both per AZURE_SETUP_GUIDE.md PART 4 Step 2."
          {
            echo "### ⚠️ Image published but NOT deployed"
            echo ""
            echo "The container image was built and pushed, but the Azure Web App was **not** updated."
            echo ""
            echo "Set these to enable automatic deploys:"
            echo "- repository **variable** \`AZURE_WEBAPP_NAME\`"
            echo "- repository **secret** \`AZURE_WEBAPP_PUBLISH_PROFILE\`"
            echo ""
            echo "Until then, restart the Web App in the Azure portal to pick up this build."
          } >> "$GITHUB_STEP_SUMMARY"
