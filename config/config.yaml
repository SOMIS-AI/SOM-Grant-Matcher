# Grant Matcher Configuration
# ============================
# Edit this file to configure the app before running.

# --- Email Settings (SendGrid) ---
# IMPORTANT: Leave these as placeholders!
# Set the real values in Azure Application Settings (never put secrets in this file).
#
# Required Azure Application Settings:
#   SENDGRID_API_KEY      → your SendGrid API key
#   SENDGRID_FROM_EMAIL   → verified sender address in your SendGrid account
#
# Recipients (comma-separated lists) are resolved at SEND time by cadence:
#   DAILY_RECIPIENTS      → daily digest, sent every day at NOTIFY_HOUR
#   WEEKLY_RECIPIENTS     → 7-day roundup, sent only on WEEKLY_WEEKDAY (default Tuesday)
#   DIAGNOSTIC_RECIPIENTS → admin-only diagnostic report (defaults to first DAILY/WEEKLY addr)
#   RESTART_RECIPIENTS    → admins who get a health email when the app starts/restarts
#                           (the ONLY email sent on restart — used to confirm a deploy is live)
#   MANUAL_RECIPIENTS     → default recipients for a manually-triggered digest
#                           (trigger with: python main.py --send-digest [--days N] [--to a@b.com])
#   (The legacy ALERT_RECIPIENTS variable has been retired.)
#
# Schedule controls (all optional, with defaults):
#   NOTIFY_TIMEZONE       → IANA tz for the fire time   (default America/New_York)
#   NOTIFY_HOUR           → hour of day, 0-23           (default 6)
#   WEEKLY_WEEKDAY        → Mon=0 .. Sun=6              (default 1 = Tuesday)
# No email is sent on startup/restart — only at the scheduled fire time.
email:
  sender: "set-via-azure-app-settings"
  sendgrid_api_key: "set-via-azure-app-settings"
  recipients:
    - "set-via-azure-app-settings"
  subject_prefix: "[Grant Match]"

# --- Faculty Profile Scraping ---
faculty:
  profiles_url: "https://www.medschool.umaryland.edu/faculty/faculty-profiles/"
  cache_file: "data/faculty_profiles.json"
  rescrape_interval_hours: 168           # Re-scrape faculty profiles every 7 days

  # Exclude faculty from MATCHING when their academic title matches one of these
  # patterns (case-insensitive regex on the title parsed from data-profile-name).
  # Excluded faculty stay in faculty_profiles.json with excluded_from_matching=True
  # so the dashboard can show them — they're just skipped during enrichment and
  # matching. Live-data tuned 2026-05-30 against ~2,600 UMSOM titles: trims
  # ~1,300 of ~3,089 (the ~42% that are adjunct / emeritus / visiting / postdoc /
  # research-associate appointments), leaving ~1,800 primary + clinical-core
  # faculty in the matching pool.
  excluded_title_patterns:
    - 'emeritus'                                  # Professor Emeritus
    - 'emerita'                                   # Professor Emerita
    - '(?<!non-)\badjunct\b'                      # 'Adjunct Professor' but NOT 'Clinical … (Non-Adjunct Faculty)'
    - '\bvisiting\b'                              # Visiting Instructor / Researcher / Professor
    - '\bpost[ -]?doc'                            # Post Doc Fellow, Post-Doctoral Fellow, Postdoc
    - '\bresearch associate\b(?!\s+professor)'    # 'Research Associate' but NOT 'Research Associate Professor'
    # Clinical-track ranks (non-tenure clinical educator/service line). Per user
    # 2026-06-23: faculty whose rank is prefixed "Clinical" are largely engaged in
    # clinical care/education, not research, and would not PI major NIH/DoD awards.
    # Anchored with ^ so it matches the RANK "Clinical [Assistant/Associate] Professor"
    # and does NOT catch "Professor of Clinical Pathology" (rank = Professor) or
    # "Research Professor". Physician-scientists carry a plain/Research rank, not this.
    - '^clinical\s+(assistant\s+|associate\s+)?professor\b'   # Clinical (Asst/Assoc) Professor

# --- Grants.gov API ---
grants:
  api_url: "https://api.grants.gov/v1/api/search2"
  check_interval_hours: 24               # How often to check for new grants
  seen_grants_file: "data/seen_grants.json"
  max_results_per_check: 100             # Grants to fetch per run
  # Only alert on these statuses (posted = currently open)
  statuses:
    - "posted"
    - "forecasted"

# --- Matching Settings ---
matching:
  min_keyword_length: 4                  # Ignore keywords shorter than this
  semantic_matching: true                # Enable semantic embedding matching (requires sentence-transformers)
  semantic_threshold: 0.40              # Cosine similarity threshold for semantic matches (0-1)
                                          # Tuned for all-MiniLM-L6-v2 model (embedder.py v5).
                                          # PubMedBert (v4) was too domain-specific — median 0.83+,
                                          # zero discrimination. MiniLM max scores are 0.40-0.57
                                          # for genuine matches. 0.40 captures strong semantic
                                          # matches without flooding. Monitor and adjust up if noisy.
  # Common words to exclude from keyword matching
  # ── Confidence scoring (new) ─────────────────────────────────────────────
  # Keywords appearing in more than this % of all faculty are auto-suppressed
  # as dynamic stop words (too generic to be meaningful match signals).
  # Example: "education" in 25% of faculty → suppressed. "glioblastoma" in 0.1% → kept.
  max_kw_prevalence_pct: 0.08          # Lowered from 0.15. At 15%, only "disease" was suppressed.
                                          # At 8%, broad terms like "cancer", "therapy", "clinical"
                                          # will also be caught, reducing false matches on broad grants.

  # Minimum confidence score to include a match in results and the email digest.
  # 0 = include all matches (no filtering). Raise to 20-30 to suppress weak matches.
  min_confidence_score: 45              # Raised 35->45 (2026-05-27). At 35%, broad infrastructure grants
                                          # (NCORP, cancer-informatics, archived-data) filled the per-grant
                                          # cap down to 36-42% with marginal matches (~81% of the 35%+ pool
                                          # sat below 45%). 45 trims that padding; genuine grants (TBI/prostate,
                                          # 60-94%) are unaffected. Pairs with the higher cap below.

  # v4.1 — New parameters
  max_matches_per_grant: 40              # Cap faculty matches per grant. Keeps email digest manageable
                                          # and prevents broad grants from matching 500+ faculty.
                                          # Highest-confidence matches are kept. 50->20->30->40: at 30, the
                                          # very strongest grants (DoW TBI Clinical) still hit the cap with
                                          # 30th-kept at 78%, meaning ~30+ faculty at >=78% were being
                                          # truncated. 40 surfaces those extra strong matches; broad grants
                                          # can't abuse the slots because the 45% floor cuts their padding.
                                          # (Tuned 2026-05-27 to 30, then 2026-05-28 to 40.)
  max_grant_text_chars: 3000             # Cap the grant text used for keyword matching. Some scraped
                                          # pages (NSF program pages, foundation portals) carry the whole
                                          # page as searchable text, which matched 500-600 faculty at
                                          # inflated 99% confidence. Truncating bounds that surface area.
                                          # 0 = no cap. Grants.gov title+synopsis is well under 3000.
  min_idf_for_match: 1.5                 # Minimum IDF for a grant keyword to count toward matching.
                                          # Keywords below this are too common across faculty.
                                          # IDF 1.5 ≈ keyword appears in ~60% of faculty.

  # ── Context-dependent generic terms (Theme 3, 2026-06-23) ─────────────────
  # Terms too generic to anchor a match on their own. A keyword match is dropped
  # when EVERY matched keyword is in this list — i.e. the faculty matched ONLY on
  # generic population/method words with no disease/domain-specific term. Keeps
  # the match as soon as ≥1 specific (non-listed) keyword also fires. From the
  # 6/19 comments: "pediatric"+"childhood" alone shouldn't match a pediatric-
  # CANCER genome grant; "risk"+"risk assessment" alone shouldn't match an
  # ecological-risk grant. Curatable — add generic offenders as they surface.
  context_dependent_terms:
    - "pediatric"
    - "childhood"
    - "child"
    - "children"
    - "adult"
    - "adults"
    - "adolescent"
    - "adolescents"
    - "aging"
    - "risk"
    - "risk assessment"
    - "risk factors"

  # ── Research track-record signal (Theme 2, 2026-06-23) ────────────────────
  # Weight a match by the faculty member's external publication/grant footprint,
  # captured during enrichment in keywords_by_source. Faculty engaged mostly in
  # clinical care/education (no PubMed/RePORTER footprint) are unlikely to PI
  # major research, so profile-keyword-only matches are weighted down and
  # NIH-funded faculty up. "unknown" (attribution not captured pre-rescrape) is
  # left neutral so we never penalize on missing data.
  research_evidence:
    nih_reporter_multiplier: 1.05        # has NIH RePORTER grant(s) — strongest track record
    publication_multiplier:  1.00        # has PubMed/Europe PMC/ORCID/S2/ClinicalTrials footprint
    none_multiplier:         0.80        # only profile / self-reported keywords (no external footprint)
    gate_major_mechanisms:   true        # hard-drop "none"-tier faculty from the major mechanisms below
  # Grant title/number markers for major independent-research mechanisms the
  # hard gate applies to. NIH R/U/P-series + the major DoD CDMRP awards. Early-
  # career / smaller mechanisms (K, T, F, R03/R21 pilot, DoD Idea/Early) are
  # intentionally omitted so newer-but-real researchers aren't gated out.
  major_mechanism_patterns:
    - '\bR01\b'
    - '\bR35\b'
    - '\bU01\b'
    - '\bU54\b'
    - '\bUM1\b'
    - '\bP01\b'
    - '\bP30\b'
    - '\bP50\b'
    - 'investigator-initiated research award'
    - '\bclinical trial award\b'
    - 'focused program award'
    - 'breakthrough award'

  # ── UMB-specific grant eligibility filter ────────────────────────────────
  # Skip grants UMB faculty are NOT eligible to apply for (institutional
  # restrictions or PI-type restrictions like trainees-only). Each entry is a
  # case-insensitive regex run against the grant title; use inline `(?-i:...)`
  # to scope acronyms back to case-sensitive (e.g. NIH 'IDeA' vs the English
  # word 'Idea' in 'DoD Idea Award'). The reason is logged + included in the
  # diagnostic so it's easy to audit and refine the list over time.
  # Validated 2026-05-30 against the 41 grants in the 2026-05-29 digest:
  # caught 11/11 user-flagged ineligible grants with 0 false positives.
  # NOTE: SBIR/STTR are intentionally NOT excluded — UMSOM faculty do collaborate
  # via faculty-founded startups, so they remain in the digest.
  ineligible_grant_patterns:
    # Institutional restrictions
    - pattern: '\bresource[- ]?limited\b'
      reason:  'institutional: resource-limited institutions only (UMB does not qualify)'
    - pattern: '(?-i:\bIDeA\b)|institutional development award'
      reason:  'institutional: IDeA-state institutions only (Maryland is not eligible)'
    - pattern: '^\s*single\s+source\b'
      reason:  'institutional: sole-source / restricted to existing awardee (also catches "Single Source Competition:" and similar variants)'
    - pattern: '\bSuRE\b|support for research excellence'
      reason:  'institutional: SuRE program (for emerging research institutions, not UMB)'
    - pattern: '\bNCORP\b(?:(?!academic).)*?\bcommunity sites?\b'
      reason:  'institutional: NCORP Community Sites (community sites only — keeps NCORP Academic Community Sites)'
    - pattern: 'biomedical research environment.*sponsored programs'
      reason:  'institutional: BRE-SPAD (research-admin development at emerging orgs)'
    - pattern: '\bMSI\b|minority[- ]?serving institution|\bHBCU\b'
      reason:  'institutional: MSI / HBCU only'
    - pattern: '\bR15\b|research enhancement award'
      reason:  'institutional: R15 / REAP — for health-prof / undergrad institutions without substantial NIH funding (UMSOM gets major NIH funding)'
    - pattern: '\bCOBRE\b|centers? of biomedical research excellence'
      reason:  'institutional: COBRE (Centers of Biomedical Research Excellence) — an IDeA-program mechanism, IDeA-states only (Maryland not eligible)'
    # PI / trainee restrictions — we ONLY exclude grants where the named PI
    # *must* be a trainee/student. Institutional training grants (T32, T35, T90,
    # K12, D43, KL2, etc.) are KEPT because the PI of those awards is a senior
    # faculty member; the trainees are downstream of the grant, not the PI.
    # Confirmed by user 2026-06-01: keep K12 + T-series institutional training grants.
    - pattern: '\bdissertation\b|\bR36\b'
      reason:  'PI: dissertation grant (doctoral students, R36)'
    - pattern: '\bF32\b|individual postdoctoral fellowship|NRSA.*postdoctoral|postdoctoral.*NRSA'
      reason:  'PI: postdoctoral fellowship (F32, trainee-only)'
    - pattern: '\bF30\b|\bF31\b|\bF33\b|predoctoral fellowship|MD/PhD fellowship'
      reason:  'PI: predoctoral fellowship (F30/F31/F33)'
    - pattern: '\bK32\b|academic career excellence'
      reason:  'PI: K32 trainee career-development award'
    - pattern: 'small grant program.*career development.*recipients|small grant.*\bmentored\b.*recipients'
      reason:  'PI: small grant for current K-awardees only'
    - pattern: 'fellowship for audiologists|research fellowship for.*students'
      reason:  'PI: trainee fellowship'
    # ── ACL / community-services & capacity grants ────────────────────────────
    # Administration for Community Living (ACL) and similar awards that pass the
    # biomedical pre-filter on aging/dementia/disability vocabulary but are
    # community-SERVICES, technical-assistance, or state-capacity programs — NOT
    # research opportunities an individual UMSOM research faculty member would PI.
    # Surfaced in the 2026-06-23 diag analysis (keyword-only matches, semantic≈0).
    # Patterns are deliberately specific so they DO NOT touch the legitimate
    # NIDILRR RESEARCH grants that look superficially similar and must be KEPT:
    #   • Disability and Rehabilitation Research Projects (DRRP) ...
    #   • Spinal Cord Injury / Traumatic Brain Injury "Model Systems" centers
    #   • Rehabilitation Research and Training Center (RRTC) ...
    # (none of those contain "resource center", "ADPI", "state grants", etc.)
    - pattern: '\bnational resource center\b|\bresource center\b'
      reason:  'services: ACL/TA national resource center (technical assistance, not research)'
    - pattern: "\\bADPI\\b|alzheimer'?s disease programs? initiative"
      reason:  'services: Alzheimer''s Disease Programs Initiative (ACL state/community capacity grant)'
    - pattern: '\blifespan respite\b'
      reason:  'services: Lifespan Respite Care state grants (services, not research)'
    - pattern: 'assistive technology.*financing|\balternative financing program\b'
      reason:  'services: Assistive Technology Alternative Financing program (state services)'
    - pattern: 'university centers? for (?:excellence in )?developmental disabilit'
      reason:  'services: University Center for Developmental Disabilities (UCEDD capacity grant)'
    - pattern: 'self[- ]?management education resource'
      reason:  'services: chronic-disease self-management education TA center (services)'
    - pattern: 'peer supports? for augmentative'
      reason:  'services: AAC peer-support demonstration grant (ACL services, not research)'
    - pattern: '\bfinancial literacy\b'
      reason:  'services: financial-literacy / ABLE-awareness program (not biomedical research)'

  # ── Static stop words ─────────────────────────────────────────────────────
  # These are always excluded regardless of IDF score.
  # The dynamic stop word system (max_kw_prevalence_pct above) handles most
  # generic terms automatically — only add truly universal terms here.
  # ── Static stop words ─────────────────────────────────────────────────────
  # Words that are ALWAYS excluded from keyword matching regardless of IDF score.
  # Two-level protection:
  #   1. Exact match: if the entire keyword equals a stop word it is dropped.
  #   2. Phrase-level check (in matcher.py): if EVERY token in a multi-word keyword
  #      is a stop word the whole phrase is dropped — catches "community health centers",
  #      "service delivery", "program evaluation", etc.
  # When adding here, also consider whether it should be a standalone term
  # or whether it may appear meaningfully inside a specific phrase
  # (e.g. "prevention" alone is too broad, but "cancer prevention" keeps "cancer").
  stop_words:
    # ── Core grant/admin boilerplate ──
    - "grant"
    - "grants"
    - "funding"
    - "award"
    - "awards"
    - "program"
    - "programs"
    - "project"
    - "projects"
    - "initiative"
    - "initiatives"
    - "center"
    - "centers"
    - "national"
    - "federal"
    - "support"
    - "supporting"
    # ── Generic research process terms ──
    - "research"
    - "study"
    - "studies"
    - "analysis"
    - "data"
    - "methods"
    - "methodology"
    - "approach"
    - "approaches"
    - "process"
    - "processes"
    - "framework"
    - "model"
    - "models"
    - "tool"
    - "tools"
    - "assessment"
    - "evaluation"
    - "measurement"
    - "testing"
    - "examining"
    - "exploring"
    - "identifying"
    - "understanding"
    - "evidence"
    # ── Institution / organization terms ──
    - "university"
    - "science"
    - "sciences"
    - "medical"
    - "medicine"
    - "clinical"
    # ── Patient / population terms (too broad alone) ──
    - "patient"
    - "patients"
    - "human"
    - "care"
    - "health"
    - "healthcare"
    - "community"
    - "communities"
    - "population"
    - "populations"
    - "individual"
    - "individuals"
    - "family"
    - "families"
    - "provider"
    - "providers"
    - "workforce"
    # ── Action verbs (generic grant language) ──
    - "improving"
    - "improvement"
    - "advancing"
    - "promoting"
    - "reducing"
    - "preventing"
    - "prevention"
    - "addressing"
    - "enhancing"
    - "strengthening"
    - "increasing"
    - "decreasing"
    - "developing"
    - "utilizing"
    - "applying"
    - "using"
    - "based"
    # ── Outcome / quality terms ──
    - "outcomes"
    - "quality"
    - "effectiveness"
    - "excellence"
    - "innovative"
    - "innovation"
    - "innovations"
    - "integrated"
    - "translational"
    - "collaborative"
    - "collaboration"
    # ── Disease / treatment (too broad alone — specific diseases kept via phrases) ──
    - "disease"
    - "treatment"
    - "conditions"
    - "chronic"
    - "education"
    - "training"
    - "intervention"
    - "interventions"
    # ── Admin / delivery ──
    - "service"
    - "services"
    - "delivery"
    - "access"
    - "equity"
    - "disparities"
    - "capacity"
    - "building"
    - "system"
    - "systems"
    - "practice"
    - "practices"
    - "policy"
    - "policies"
    - "management"
    - "implementation"
    - "development"
    - "precision"
    - "writing"
    # ── Developmental (standalone too generic) ──
    - "developmental"
    # ── 2026-05-28 additions — data-driven (top noise drivers from the 2026-05-28
    #    digest) + user-flagged generics + preemptive. Phrase-level safety: a
    #    multi-word keyword is only dropped if EVERY token is a stop, so
    #    "clinical trial", "brain injury", "early-stage cancer", "machine learning",
    #    "novel therapeutics", "cancer informatics" all survive.
    - "single"
    - "basic"
    - "mathematics"
    - "current"
    - "centered"
    - "mechanisms"
    - "imaging"          # phrase-safe: "MRI imaging", "molecular imaging" survive
    - "comparative"      # accepted risk: "comparative effectiveness" becomes all-stops
    - "defense"          # matches "Department of Defense" in DoD grant text
    - "trial"            # "clinical trial" survives (clinical is not a stop)
    - "trials"
    - "fellowship"
    - "cycle"
    - "discovery"        # "drug discovery" survives
    - "early"
    - "stage"
    - "through"          # preposition; literal noise
    - "diseases"         # plural of "disease" which was already a stop
    - "disorder"
    - "post"
    - "related"
    - "strategies"
    - "multiple"
    - "technologies"
    - "department"
    - "complex"
    - "small"
    - "specific"
    - "advanced"
    - "address"          # complements "addressing" already in list
    - "required"
    - "investigator"
    - "coordinating"
    - "leadership"
    - "peer"
    - "virtual"
    - "learning"         # accepted risk: "machine learning" still keeps "machine"
    - "novel"
    - "informatics"      # "cancer informatics" survives (cancer not a stop)

# --- Logging ---
logging:
  level: "INFO"                          # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/grant_matcher.log"
  max_log_size_mb: 10
  backup_count: 3

# --- NIH RePORTER & Federal RePORTER APIs ---
nih_reporter:
  enabled: false                           # DISABLED: Returns awarded projects, not open opportunities
  federal_reporter_enabled: false          # DISABLED: Returns awarded projects, not open opportunities
  max_results_per_check: 100               # Max results per API call

# --- External Grant Sources (Foundations, Portals, Listing Services) ---
# All sources are enabled by default. To disable specific ones, add them
# to disabled_sources. Or set enabled_sources to only run a specific subset.
external_sources:
  enabled: true
  # Sources confirmed to have NEVER returned a result (their pages are
  # JavaScript-rendered or their structure changed, so requests-based scraping
  # gets an empty shell). Disabled to cut ~36s of dead runtime per cycle and
  # de-noise the scraper-health report. Re-enable individually if a working
  # scraper is implemented (e.g. via a headless browser or an official API/feed).
  disabled_sources:
    # nih_guide: NIH Guide RSS (fundingopps.xml) is reachable locally but
    # consistently unreachable from the Azure container (5 consecutive zero-runs,
    # "never reachable" per the scraper-health tracker). NIH funding opportunities
    # are already covered by Grants.gov, so this is a no-loss disable; clears the
    # likely_broken alert noise from the diagnostic. (2026-05-28.)
    - "nih_guide"
    - "pnd_rfps"
    - "dod_cdmrp"
    - "burroughs_wellcome"
    - "hhmi"
    - "damon_runyon"
    - "doris_duke"
    - "rwjf"
    - "keck"
    - "beckman"
    - "march_of_dimes"
    - "gates"
    - "wellcome_trust"
    - "koch_foundation"
    - "yield_giving"
    - "science_philanthropy_alliance"
    - "ucla_dgsom"
    - "miami_miller"
    - "aamc_grants"
    # stanford_rmg scrapes Stanford's internal research-admin site (process pages
    # like "Budget Development", "Subaward Closeout") — not a funding source.
    - "stanford_rmg"
  #
  # Available source keys:
  #   Tier 3 — Major Biomedical Research Funders:
  #     burroughs_wellcome, hhmi, aha, acs, damon_runyon, alexs_lemonade,
  #     doris_duke, rwjf, keck, beckman, march_of_dimes, alzheimers_assoc,
  #     aacr, simons, czi, gates, wellcome_trust
  #
  #   Tier 3 — Application Portals:
  #     proposal_central, science_philanthropy_alliance
  #
  #   Tier 3 — Free Listing Services:
  #     pnd_rfps, nih_guide, dod_cdmrp, nsf_funding
  #
  #   Tier 4 — Medical School Pages:
  #     stanford_rmg, ucla_dgsom, miami_miller, aamc_grants
