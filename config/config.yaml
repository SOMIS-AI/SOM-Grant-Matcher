# Grant Matcher Configuration
# ============================
# Edit this file to configure the app before running.

# --- Email Settings (SendGrid) ---
# IMPORTANT: Leave these as placeholders!
# Set the real values in Azure Application Settings (never put secrets in this file).
#
# Required Azure Application Settings:
#   SENDGRID_API_KEY      → your SendGrid API key
#   SENDGRID_FROM_EMAIL   → verified sender address in your SendGrid account
#
# Recipients (comma-separated lists) are resolved at SEND time by cadence:
#   DAILY_RECIPIENTS      → daily digest, sent every day at NOTIFY_HOUR
#   WEEKLY_RECIPIENTS     → 7-day roundup, sent only on WEEKLY_WEEKDAY (default Tuesday)
#   DIAGNOSTIC_RECIPIENTS → admin-only diagnostic report (defaults to first DAILY/WEEKLY addr)
#   RESTART_RECIPIENTS    → admins who get a health email when the app starts/restarts
#                           (the ONLY email sent on restart — used to confirm a deploy is live)
#   MANUAL_RECIPIENTS     → default recipients for a manually-triggered digest
#                           (trigger with: python main.py --send-digest [--days N] [--to a@b.com])
#   (The legacy ALERT_RECIPIENTS variable has been retired.)
#
# Schedule controls (all optional, with defaults):
#   NOTIFY_TIMEZONE       → IANA tz for the fire time   (default America/New_York)
#   NOTIFY_HOUR           → hour of day, 0-23           (default 6)
#   WEEKLY_WEEKDAY        → Mon=0 .. Sun=6              (default 1 = Tuesday)
# No email is sent on startup/restart — only at the scheduled fire time.
email:
  sender: "set-via-azure-app-settings"
  sendgrid_api_key: "set-via-azure-app-settings"
  recipients:
    - "set-via-azure-app-settings"
  subject_prefix: "[Grant Match]"

# --- Faculty Feedback (pilot, 2026-08-04; rater + opt-out 2026-08-05) ---
# Per-match 👍/👎 links in the faculty AND dept-research-administrator emails
# (admins answer ON BEHALF of their faculty), plus a form-recorded opt-out
# link in every footer — all wired to ONE prefilled Microsoft Form.
# Setup (one time):
#   1. Create a Microsoft Form with exactly these questions:
#        Q1 "Match ID"  — text (machine-filled; note in the description that
#                          respondents should leave it as-is)
#        Q2 "Verdict"   — choice with options EXACTLY:
#                          "Good match", "Not relevant", "Opt out of emails"
#        Q3 "Comments"  — text, long answer, optional ("Why? Optional but very helpful")
#   2. Form → (…) → Get pre-filled link: type {match} into Match ID, pick
#      "Good match" for Verdict, copy the generated URL.
#   3. In that URL replace the encoded answer "Good%20match" (the Verdict value)
#      with {verdict}, then paste it below as form_url_template.
#   The app substitutes {match} and {verdict} (URL-encoded) at send time.
#   {match} = "email|grant_number|run_date|confidence|match_type|rater" where
#   rater is "self" (the faculty member) or "admin" (a dept research admin
#   answering on their behalf). Opt-outs arrive as
#   "recipient_email|OPTOUT|run_date|-|-|rater" with Verdict "Opt out of
#   emails" — process them by unenrolling the recipient in subscriptions.
#   Leave form_url_template empty to disable the links entirely (opt-out then
#   falls back to a mailto link so recipients always have a way out).
feedback:
  enabled: true
  form_url_template: ""

# Faculty-facing "learn more" page — linked at the bottom of every digest,
# faculty, and dept-admin email once set. Host UMSOM_AI_Grant_Matcher_About.html
# (self-contained, screenshots embedded) anywhere faculty can reach without
# login — e.g. the SOM web CMS or an anonymous-access /about route. ABOUT_URL
# in Azure App Settings overrides this without a redeploy. Empty = link omitted.
about_url: ""

# --- Faculty Profile Scraping ---
faculty:
  profiles_url: "https://www.medschool.umaryland.edu/faculty/faculty-profiles/"
  cache_file: "data/faculty_profiles.json"
  rescrape_interval_hours: 168           # Re-scrape faculty profiles every 7 days
  # Safety guard: if a fresh scrape returns fewer than (1 - max_roster_drop_pct)
  # of the previously-active faculty, treat it as a partial scrape failure —
  # keep the cached roster, mark no one inactive, and retry next run. Prevents a
  # flaky department-page scrape from silently cutting faculty off from alerts.
  max_roster_drop_pct: 0.15

  # Exclude faculty from MATCHING when their academic title matches one of these
  # patterns (case-insensitive regex on the title parsed from data-profile-name).
  # Excluded faculty stay in faculty_profiles.json with excluded_from_matching=True
  # so the dashboard can show them — they're just skipped during enrichment and
  # matching. Live-data tuned 2026-05-30 against ~2,600 UMSOM titles: trims
  # ~1,300 of ~3,089 (the ~42% that are adjunct / emeritus / visiting / postdoc /
  # research-associate appointments), leaving ~1,800 primary + clinical-core
  # faculty in the matching pool.
  excluded_title_patterns:
    - 'emeritus'                                  # Professor Emeritus
    - 'emerita'                                   # Professor Emerita
    - '(?<!non-)\badjunct\b'                      # 'Adjunct Professor' but NOT 'Clinical … (Non-Adjunct Faculty)'
    - '\bvisiting\b'                              # Visiting Instructor / Researcher / Professor
    - '\bpost[ -]?doc'                            # Post Doc Fellow, Post-Doctoral Fellow, Postdoc
    - '\bresearch associate\b(?!\s+professor)'    # 'Research Associate' but NOT 'Research Associate Professor'
    # Clinical-track ranks (non-tenure clinical educator/service line). Per user
    # 2026-06-23: faculty whose rank is prefixed "Clinical" are largely engaged in
    # clinical care/education, not research, and would not PI major NIH/DoD awards.
    # Anchored with ^ so it matches the RANK "Clinical [Assistant/Associate] Professor"
    # and does NOT catch "Professor of Clinical Pathology" (rank = Professor) or
    # "Research Professor". Physician-scientists carry a plain/Research rank, not this.
    - '^clinical\s+(assistant\s+|associate\s+)?professor\b'   # Clinical (Asst/Assoc) Professor

  # ── Employment-status exclusion (data-salary-desc on the dept pages) ───────
  # 2026-06-23: each department faculty-listing <li> carries data-salary-desc —
  # the same field driving the page's "Volunteer" / "Part Time" tabs. Volunteer
  # and part-time faculty (e.g. Donald Milton — volunteer, primary appt at College
  # Park; Kenneth Crandall — part-time) would not submit major research through
  # UMSOM, so drop them from the matching pool. Values seen: VOLUNTEER, PART TIME,
  # FULL TIME, GEOGRAPHIC FULL TIME (match exact, case-insensitive). Captured at
  # scrape time → needs ONE re-scrape (FORCE_SCRAPE) to populate employment_status
  # on cached faculty; degrades gracefully (no exclusion) until then.
  excluded_employment_statuses:
    - "VOLUNTEER"
    - "PART TIME"
  # data-emp-type distinguishes FACULTY from FELLOW (trainees). Fellows are too
  # junior to PI major research (cf. the "research fellow" flagged in the 6/23
  # comments) — exclude them too. Remove "FELLOW" here to keep fellows in.
  excluded_emp_types:
    - "FELLOW"

# --- Grants.gov API ---
grants:
  api_url: "https://api.grants.gov/v1/api/search2"
  check_interval_hours: 24               # How often to check for new grants
  seen_grants_file: "data/seen_grants.json"
  max_results_per_check: 100             # Grants to fetch per run
  # Only alert on these statuses (posted = currently open)
  statuses:
    - "posted"
    - "forecasted"

# --- Matching Settings ---
matching:
  min_keyword_length: 4                  # Ignore keywords shorter than this
  semantic_matching: true                # Enable semantic embedding matching (requires sentence-transformers)
  semantic_threshold: 0.40              # Cosine similarity threshold for semantic matches (0-1)
                                          # Tuned for all-MiniLM-L6-v2 model (embedder.py v5).
                                          # PubMedBert (v4) was too domain-specific — median 0.83+,
                                          # zero discrimination. MiniLM max scores are 0.40-0.57
                                          # for genuine matches. 0.40 captures strong semantic
                                          # matches without flooding. Monitor and adjust up if noisy.
  # Common words to exclude from keyword matching
  # ── Confidence scoring (new) ─────────────────────────────────────────────
  # Keywords appearing in more than this % of all faculty are auto-suppressed
  # as dynamic stop words (too generic to be meaningful match signals).
  # Example: "education" in 25% of faculty → suppressed. "glioblastoma" in 0.1% → kept.
  max_kw_prevalence_pct: 0.08          # Lowered from 0.15. At 15%, only "disease" was suppressed.
                                          # At 8%, broad terms like "cancer", "therapy", "clinical"
                                          # will also be caught, reducing false matches on broad grants.

  # Minimum confidence score to include a match in results and the email digest.
  # 0 = include all matches (no filtering). Raise to 20-30 to suppress weak matches.
  min_confidence_score: 50              # Raised 35->45 (2026-05-27), 45->50 (2026-08-04) for the faculty
                                          # pilot: the Jul-26..Aug-04 diag review showed 65% of delivered
                                          # matches sat at 45-49 — mostly semantic-only rows with no visible
                                          # justification. 50 gives faculty a cleaner first impression;
                                          # the 👍/👎 feedback data will tell us where to set this properly.
                                          # (Historical context, 05-27: at 35%, broad infrastructure grants
                                          # filled the per-grant cap with marginal matches.)

  # v4.1 — New parameters
  max_matches_per_grant: 40              # Cap faculty matches per grant. Keeps email digest manageable
                                          # and prevents broad grants from matching 500+ faculty.
                                          # Highest-confidence matches are kept. 50->20->30->40: at 30, the
                                          # very strongest grants (DoW TBI Clinical) still hit the cap with
                                          # 30th-kept at 78%, meaning ~30+ faculty at >=78% were being
                                          # truncated. 40 surfaces those extra strong matches; broad grants
                                          # can't abuse the slots because the 45% floor cuts their padding.
                                          # (Tuned 2026-05-27 to 30, then 2026-05-28 to 40.)
  max_grant_text_chars: 3000             # Cap the grant text used for keyword matching. Some scraped
                                          # pages (NSF program pages, foundation portals) carry the whole
                                          # page as searchable text, which matched 500-600 faculty at
                                          # inflated 99% confidence. Truncating bounds that surface area.
                                          # 0 = no cap. Grants.gov title+synopsis is well under 3000.
  min_idf_for_match: 1.5                 # Minimum IDF for a grant keyword to count toward matching.
                                          # Keywords below this are too common across faculty.
                                          # IDF 1.5 ≈ keyword appears in ~60% of faculty.

  # ── Phrase-aware scoring (2026-06-26) ─────────────────────────────────────
  # Fixes the scoring inversion where TWO loose single-word hits ("kidney" +
  # "cancer") outscored ONE precise concept phrase ("kidney cancer"). A matched
  # keyword is now weighted by how many MEANINGFUL tokens it carries (long, non-
  # stop words), and multi-word phrases get a higher IDF cap so a genuinely
  # specific phrase can dominate. Single-component matches — where a faculty's
  # only hits are isolated component words of the grant's title concept (e.g. a
  # polycystic-kidney-disease researcher matching just "kidney" on a kidney-
  # CANCER grant) — are demoted but kept visible. Set enabled: false to revert
  # to the old flat min(IDF, 5.0) sum.
  phrase_scoring:
    enabled: true
    token_bonus: 0.6                     # each extra meaningful token multiplies the keyword's
                                          # IDF weight by (1 + 0.6*(n_tokens-1)): 2-word ×1.6, 3-word ×2.2
    idf_cap: 5.0                         # per-keyword IDF cap for a SINGLE-word match
    multiword_cap: 13.0                  # raised IDF cap for a MULTI-word phrase match (lets a
                                          # specific phrase carry a match on its own)
    component_only_multiplier: 0.5       # confidence ×0.5 when the ONLY hits are isolated single
                                          # component words of the grant title concept (demote, keep visible)

  # Separate confidence floor for SEMANTIC-only matches. Semantic confidence =
  # similarity × 100, and a sim near MiniLM's 0.40–0.57 ceiling is a genuinely
  # strong match — but min_confidence_score=45 was calibrated for IDF-based
  # KEYWORD scores, so it was also deleting real semantic matches that scored
  # 0.40–0.44. 42 reopens that band for the semantic channel without flooding
  # (the per-grant cap still bounds volume). Watch the diagnostic and nudge
  # toward 40 (more recall) or 45 (less noise). Leave unset to reuse
  # min_confidence_score for everything (old behaviour).
  # MEASURED 2026-06-26: this does NOT rescue sparse-profile near-misses like
  # Katrina Mark ("substance use in pregnancy" → MMHSUD grant), whose embedding
  # sim is only ~0.32 — well below the 0.40 threshold, so she never reaches this
  # floor at all. Catching her needs richer faculty embedding text (publications,
  # not just self-listed keywords), not a lower floor. See embedder.faculty_to_text.
  # 2026-08-04: raised 42->50 with min_confidence_score for the faculty pilot —
  # otherwise the semantic channel would keep flooding the 42-49 band the pilot
  # floor is meant to cut. sim>=0.50 is genuinely strong for MiniLM (its ceiling
  # over 10 days of diags was 0.573). Revisit both floors once 👍/👎 data lands.
  min_semantic_confidence: 50

  # ── Semantic distinctive-concept guard (2026-06-26) ───────────────────────
  # Publication-enriched embeddings (fix #4) raise recall but reintroduce the
  # "kidney disease ≠ kidney cancer" confusion on the SEMANTIC channel: a PKD
  # researcher's titles ("polycystic kidney", "kidney cystogenesis") embed close
  # to a kidney-CANCER grant, so they clear the 0.40 threshold (measured: Watnick
  # sim 0.436 on DoW Kidney Cancer). The keyword phrase-scoring fix can't catch
  # this — it's a semantic-only match with no keyword hit. This guard demotes a
  # SEMANTIC-ONLY match when the grant is about a distinctive concept (e.g. cancer)
  # but the faculty's text (keywords + evidence_titles) shows NO evidence of it.
  # Keyword/"both" matches are lexically grounded and are never guarded.
  # Each group: grant_markers flag the grant as being about the concept;
  # evidence_markers are what the faculty must show to be a credible semantic match.
  semantic_concept_guard:
    enabled: true
    demote_multiplier: 0.4        # semantic-only match missing the concept evidence → conf ×0.4
                                    # (drops below the digest floor; still visible in the diagnostic)
    groups:
      - name: oncology
        grant_markers:    ['cancer', 'carcinoma', 'oncolog', 'tumou?rs?', 'neoplas', 'malignan',
                           'sarcoma', 'leukem', 'lymphoma', 'melanoma', 'glioma', 'glioblastoma',
                           'metasta', 'adenocarcinoma']
        evidence_markers: ['cancer', 'carcinoma', 'oncolog', 'tumou?rs?', 'neoplas', 'malignan',
                           'sarcoma', 'leukem', 'lymphoma', 'melanoma', 'glioma', 'glioblastoma',
                           'metasta', 'adenocarcinoma', 'chemotherap', 'immunotherap']

  # ── Context-dependent generic terms (Theme 3, 2026-06-23) ─────────────────
  # Terms too generic to anchor a match on their own. A keyword match is dropped
  # when EVERY matched keyword is in this list — i.e. the faculty matched ONLY on
  # generic population/method words with no disease/domain-specific term. Keeps
  # the match as soon as ≥1 specific (non-listed) keyword also fires. From the
  # 6/19 comments: "pediatric"+"childhood" alone shouldn't match a pediatric-
  # CANCER genome grant; "risk"+"risk assessment" alone shouldn't match an
  # ecological-risk grant. Curatable — add generic offenders as they surface.
  context_dependent_terms:
    # Population words (original 2026-06-23 set)
    - "pediatric"
    - "childhood"
    - "child"
    - "children"
    - "adult"
    - "adults"
    - "adolescent"
    - "adolescents"
    - "aging"
    - "risk"
    - "risk assessment"
    - "risk factors"
    # ── Method / domain-agnostic terms (added 2026-08-22) ───────────────────
    # Every term below was observed anchoring a delivered match on an
    # off-topic grant in the 08-11..08-22 digests. They describe a METHOD, a
    # MEASUREMENT, or a generic construct used identically inside and outside
    # biomedicine, so on their own they say nothing about topical fit. See
    # TUNING_LOG.md 2026-08-22 for the evidence behind each group.
    #
    # Computational / statistical method — drove 11 faculty onto the NSF
    # "Condensed Matter and Materials Theory" call at 50-69% confidence.
    - "machine"
    - "machine learning"
    - "deep learning"
    - "artificial intelligence"
    - "simulation"
    - "simulations"
    - "modeling"
    - "monte carlo"
    - "molecular dynamics"
    - "statistical"
    - "statistics"
    - "prediction"
    - "computational"
    # Physical-science measurement / generic scientific constructs — same grant.
    - "temperature"
    - "chemistry"
    - "structure"
    - "evolution"
    # Environmental / agricultural — put two Psychiatry faculty on a wild-deer
    # chronic-wasting-disease ecology call, one of them at 90%.
    - "ecology"
    - "spatial ecology"
    - "agriculture"
    - "agricultural"
    # Economic / administrative — put two Surgery faculty on a USDA
    # "Agriculture Risk Management Education" call at 87%.
    - "insurance"
    - "marketing"
    - "risk reduction"
    # ── Academic / institutional vocabulary (added 2026-08-28) ──────────────
    # Second family of the same bug, found in the 08-25/08-27 review. Every
    # person at a medical school is "faculty", has "students", and works with
    # "technology" — these words describe the setting, not the science, so they
    # cannot indicate topical fit. They put 9 faculty on a USDA "Tribal Colleges
    # Education Equity" call at 52-98% (top match: engineering, faculty,
    # students, teaching). "technology" and "educational" are the singular forms
    # of "technologies" and "education", already stop-worded below since June.
    - "faculty"
    - "faculty development"
    - "students"
    - "student"
    - "teaching"
    - "curricula"
    - "curriculum"
    - "educational"
    - "technology"
    - "engineering"
    - "instrumentation"
    - "strategic partnerships"
    - "food"
    - "online"

  # ── Research track-record signal (Theme 2, 2026-06-23) ────────────────────
  # Weight a match by the faculty member's external publication/grant footprint,
  # captured during enrichment in keywords_by_source. Faculty engaged mostly in
  # clinical care/education (no PubMed/RePORTER footprint) are unlikely to PI
  # major research, so profile-keyword-only matches are weighted down and
  # NIH-funded faculty up. "unknown" (attribution not captured pre-rescrape) is
  # left neutral so we never penalize on missing data.
  research_evidence:
    nih_reporter_multiplier: 1.05        # has NIH RePORTER grant(s) — strongest track record
    publication_multiplier:  1.00        # has PubMed/Europe PMC/ORCID/S2/ClinicalTrials footprint
    none_multiplier:         0.80        # only profile / self-reported keywords (no external footprint)
    gate_major_mechanisms:   true        # hard-drop "none"-tier faculty from the major mechanisms below
    gate_pi_track_record:    true        # STRICTER: drop "none" AND "pub" tiers (require NIH-funded,
                                          # i.e. nih-tier) from the PI-track-record mechanisms below
  # Grant title/number markers for major independent-research mechanisms the
  # hard gate applies to. NIH R/U/P-series + the major DoD CDMRP awards. Early-
  # career / smaller mechanisms (K, T, F, R03/R21 pilot, DoD Idea/Early) are
  # intentionally omitted so newer-but-real researchers aren't gated out.
  major_mechanism_patterns:
    - '\bR01\b'
    - '\bR35\b'
    - '\bU01\b'
    - '\bU54\b'
    - '\bUM1\b'
    - '\bP01\b'
    - '\bP30\b'
    - '\bP50\b'
    - 'investigator-initiated research award'
    - '\bclinical trial award\b'
    - 'focused program award'
    - 'breakthrough award'
  # PI-track-record mechanisms (2026-06-23 K12 comment): the PI must be an
  # ESTABLISHED, NIH-funded investigator who mentors — not merely research-active.
  # These require nih-tier (has an NIH RePORTER grant); "none" AND "pub" tiers are
  # dropped. Covers institutional mentored career-development (K12/KL2) and
  # institutional training-grant program directors (T32/T35), whose PIs/directors
  # are senior NIH-funded faculty. NOTE: nih-tier = an ACTIVE NIH grant (RePORTER
  # enrichment is active-grant based), a stricter proxy than "prior NIH funding";
  # mentoring history is not detectable from our data. If a grant's keyword-matched
  # faculty are all non-NIH-funded, it correctly shows zero matches.
  pi_track_record_patterns:
    - '\bK12\b'
    - '\bKL2\b'
    - '\bT32\b'
    - '\bT35\b'
    - 'mentored career development'
    - 'institutional .*career development award'

  # ── Clinical-research vs basic-science matching (Theme 1, phased v1) ───────
  # 2026-06-23 match comments: purely basic-science PIs (rodent/cell/molecular)
  # keep matching grants that REQUIRE human-subjects/clinical/registry/services
  # work they can't lead — e.g. TBI/SCI "Model Systems" registries (Faw "uses
  # rodents", Mayer/Lipinski/Zhuo basic), ADRD direct-services grants (Longden
  # et al.). This suppresses a match ONLY when BOTH hold: (a) the grant looks
  # clinical/human-subjects-required, AND (b) the faculty looks PURELY basic
  # (basic signals present, ZERO clinical signals — the zero-clinical guard
  # keeps translational/physician-scientists who also use animal models safe).
  # Conservative + fully audited in the diagnostic (clinical_basic_suppressed)
  # so we can tune the term lists or disable. Config-only; no re-scrape.
  clinical_basic_filter:
    enabled: true
    report_only: false            # FLIPPED LIVE 2026-08-04 (user approved). In 6 weeks of
                                    # report-only validation the filter fired once (2026-06-25,
                                    # 5 basic scientists on an AIDS Research Center grant) and the
                                    # call was correct. Conservative trigger conditions + full
                                    # diagnostic audit trail (clinical_basic_suppressed) retained.
    # Grant requires human-subjects / clinical / registry / direct-services work.
    # NOTE: "Clinical Trials Not Allowed" is NOT a clinical-required signal (it
    # permits basic research), so we match "required/optional" but not that.
    clinical_required_patterns:
      - 'data and statistical center'
      - '\bmodel systems?\b'
      - '\bregistr(?:y|ies)\b'
      - '\blongitudinal\b'
      - 'direct services?'
      - '\bcaregivers?\b'
      - 'human subjects?'
      - 'enroll[a-z]*\s+(?:at least\s+)?(?:\d+\s+)?(?:human\s+)?participants?'
      - 'participants?\s+(?:per year|annually|into)'
      # Only "Clinical Trial(s) REQUIRED" signals human-subjects-mandatory. NOT
      # "Optional" (basic research is explicitly welcome) nor "Not Allowed"
      # (basic-only). Validated 2026-06-25: "P30 Clinical Trial Optional" had
      # over-fired this rule and report-only-suppressed basic scientists.
      - 'clinical trials?\s+required'
    # Faculty basic-science signals (matched word-boundary against keyword pool).
    basic_science_terms:
      - mice
      - mouse
      - murine
      - rat
      - rats
      - rodent
      - rodents
      - zebrafish
      - drosophila
      - c. elegans
      - in vitro
      - in vivo
      - cell line
      - cell lines
      - knockout
      - knock-out
      - transgenic
      - preclinical
      - animal model
      - animal models
      - signaling pathway
      - signaling pathways
    # Clinical signals — ANY present means NOT basic-only (keeps translational PIs).
    clinical_science_terms:
      - patients
      - patient
      - clinical trial
      - clinical trials
      - randomized
      - randomised
      - cohort
      - human subjects
      - participants
      - registry
      - epidemiolog
      - health services
      - clinical outcomes
    min_basic_signals: 1          # ≥ this many basic terms to qualify as basic-science

  # ── UMB-specific grant eligibility filter ────────────────────────────────
  # Skip grants UMB faculty are NOT eligible to apply for (institutional
  # restrictions or PI-type restrictions like trainees-only). Each entry is a
  # case-insensitive regex run against the grant title; use inline `(?-i:...)`
  # to scope acronyms back to case-sensitive (e.g. NIH 'IDeA' vs the English
  # word 'Idea' in 'DoD Idea Award'). The reason is logged + included in the
  # diagnostic so it's easy to audit and refine the list over time.
  # Validated 2026-05-30 against the 41 grants in the 2026-05-29 digest:
  # caught 11/11 user-flagged ineligible grants with 0 false positives.
  # NOTE: SBIR/STTR are intentionally NOT excluded — UMSOM faculty do collaborate
  # via faculty-founded startups, so they remain in the digest.
  ineligible_grant_patterns:
    # Institutional restrictions
    - pattern: '\bresource[- ]?limited\b'
      reason:  'institutional: resource-limited institutions only (UMB does not qualify)'
    - pattern: '(?-i:\bIDeA\b)|institutional development award'
      reason:  'institutional: IDeA-state institutions only (Maryland is not eligible)'
    - pattern: '^\s*single\s+source\b'
      reason:  'institutional: sole-source / restricted to existing awardee (also catches "Single Source Competition:" and similar variants)'
    - pattern: '\bSuRE\b|support for research excellence'
      reason:  'institutional: SuRE program (for emerging research institutions, not UMB)'
    - pattern: '\bNCORP\b(?:(?!academic).)*?\bcommunity sites?\b'
      reason:  'institutional: NCORP Community Sites (community sites only — keeps NCORP Academic Community Sites)'
    - pattern: 'biomedical research environment.*sponsored programs'
      reason:  'institutional: BRE-SPAD (research-admin development at emerging orgs)'
    - pattern: '\bMSI\b|minority[- ]?serving institution|\bHBCU\b'
      reason:  'institutional: MSI / HBCU only'
    # Land-grant / tribal-college family (added 2026-08-28). Same category as
    # MSI/HBCU above, which is why the gap was easy to miss: these are USDA-NIFA
    # capacity and equity programs restricted by institution TYPE. UMB is not a
    # land-grant institution, a tribal college, or a college of agriculture, so
    # faculty cannot apply to any of them. Three reached digests before this was
    # caught: "Scholarships for Students at 1890 Institutions" (08-11), "Tribal
    # Colleges Education Equity Grants Program" (9 faculty at 52-98%, 08-25) and
    # "Capacity Building Grants for Non-Land-Grant Colleges of Agriculture"
    # (08-27). Scanned against all 1,276 distinct grant titles in the diagnostic
    # archive: 4 hits, all correct, no false positives.
    - pattern: '\bland[- ]?grant\b'
      reason:  'institutional: land-grant (and non-land-grant college of agriculture) programs - UMB is neither'
    - pattern: '\btribal college|\btribally[- ]controlled\b'
      reason:  'institutional: tribal colleges / 1994 land-grant institutions only'
    - pattern: '\b1890\b|\b1994\s+(?:institution|land[- ]?grant)'
      reason:  'institutional: 1890 / 1994 land-grant institutions only'
    - pattern: '\bNLGCA\b'
      reason:  'institutional: Non-Land-Grant Colleges of Agriculture - acronym form of the above'
    - pattern: '\bR15\b|research enhancement award'
      reason:  'institutional: R15 / REAP — for health-prof / undergrad institutions without substantial NIH funding (UMSOM gets major NIH funding)'
    - pattern: '\bCOBRE\b|centers? of biomedical research excellence'
      reason:  'institutional: COBRE (Centers of Biomedical Research Excellence) — an IDeA-program mechanism, IDeA-states only (Maryland not eligible)'
    # PI / trainee restrictions — we ONLY exclude grants where the named PI
    # *must* be a trainee/student. Institutional training grants (T32, T35, T90,
    # K12, D43, KL2, etc.) are KEPT because the PI of those awards is a senior
    # faculty member; the trainees are downstream of the grant, not the PI.
    # Confirmed by user 2026-06-01: keep K12 + T-series institutional training grants.
    - pattern: '\bdissertation\b|\bR36\b'
      reason:  'PI: dissertation grant (doctoral students, R36)'
    - pattern: '\bF32\b|individual postdoctoral fellowship|NRSA.*postdoctoral|postdoctoral.*NRSA'
      reason:  'PI: postdoctoral fellowship (F32, trainee-only)'
    - pattern: '\bF30\b|\bF31\b|\bF33\b|predoctoral fellowship|MD/PhD fellowship'
      reason:  'PI: predoctoral fellowship (F30/F31/F33)'
    - pattern: '\bK32\b|academic career excellence'
      reason:  'PI: K32 trainee career-development award'
    - pattern: 'small grant program.*career development.*recipients|small grant.*\bmentored\b.*recipients'
      reason:  'PI: small grant for current K-awardees only'
    - pattern: 'fellowship for audiologists|research fellowship for.*students'
      reason:  'PI: trainee fellowship'
    # ── ACL / community-services & capacity grants ────────────────────────────
    # Administration for Community Living (ACL) and similar awards that pass the
    # biomedical pre-filter on aging/dementia/disability vocabulary but are
    # community-SERVICES, technical-assistance, or state-capacity programs — NOT
    # research opportunities an individual UMSOM research faculty member would PI.
    # Surfaced in the 2026-06-23 diag analysis (keyword-only matches, semantic≈0).
    # Patterns are deliberately specific so they DO NOT touch the legitimate
    # NIDILRR RESEARCH grants that look superficially similar and must be KEPT:
    #   • Disability and Rehabilitation Research Projects (DRRP) ...
    #   • Spinal Cord Injury / Traumatic Brain Injury "Model Systems" centers
    #   • Rehabilitation Research and Training Center (RRTC) ...
    # (none of those contain "resource center", "ADPI", "state grants", etc.)
    - pattern: '\bnational resource center\b|\bresource center\b'
      reason:  'services: ACL/TA national resource center (technical assistance, not research)'
    - pattern: "\\bADPI\\b|alzheimer'?s disease programs? initiative"
      reason:  'services: Alzheimer''s Disease Programs Initiative (ACL state/community capacity grant)'
    - pattern: '\blifespan respite\b'
      reason:  'services: Lifespan Respite Care state grants (services, not research)'
    - pattern: 'assistive technology.*financing|\balternative financing program\b'
      reason:  'services: Assistive Technology Alternative Financing program (state services)'
    - pattern: 'university centers? for (?:excellence in )?developmental disabilit'
      reason:  'services: University Center for Developmental Disabilities (UCEDD capacity grant)'
    - pattern: 'self[- ]?management education resource'
      reason:  'services: chronic-disease self-management education TA center (services)'
    - pattern: 'peer supports? for augmentative'
      reason:  'services: AAC peer-support demonstration grant (ACL services, not research)'
    - pattern: '\bfinancial literacy\b'
      reason:  'services: financial-literacy / ABLE-awareness program (not biomedical research)'

  # ── Static stop words ─────────────────────────────────────────────────────
  # These are always excluded regardless of IDF score.
  # The dynamic stop word system (max_kw_prevalence_pct above) handles most
  # generic terms automatically — only add truly universal terms here.
  # ── Static stop words ─────────────────────────────────────────────────────
  # Words that are ALWAYS excluded from keyword matching regardless of IDF score.
  # Two-level protection:
  #   1. Exact match: if the entire keyword equals a stop word it is dropped.
  #   2. Phrase-level check (in matcher.py): if EVERY token in a multi-word keyword
  #      is a stop word the whole phrase is dropped — catches "community health centers",
  #      "service delivery", "program evaluation", etc.
  # When adding here, also consider whether it should be a standalone term
  # or whether it may appear meaningfully inside a specific phrase
  # (e.g. "prevention" alone is too broad, but "cancer prevention" keeps "cancer").
  stop_words:
    # ── Core grant/admin boilerplate ──
    - "grant"
    - "grants"
    - "funding"
    - "award"
    - "awards"
    - "program"
    - "programs"
    - "project"
    - "projects"
    - "initiative"
    - "initiatives"
    - "center"
    - "centers"
    - "national"
    - "federal"
    - "support"
    - "supporting"
    # ── Generic research process terms ──
    - "research"
    - "study"
    - "studies"
    - "analysis"
    - "data"
    - "methods"
    - "methodology"
    - "approach"
    - "approaches"
    - "process"
    - "processes"
    - "framework"
    - "model"
    - "models"
    - "tool"
    - "tools"
    - "assessment"
    - "evaluation"
    - "measurement"
    - "testing"
    - "examining"
    - "exploring"
    - "identifying"
    - "understanding"
    - "evidence"
    # ── Institution / organization terms ──
    - "university"
    - "science"
    - "sciences"
    - "medical"
    - "medicine"
    - "clinical"
    # ── Patient / population terms (too broad alone) ──
    - "patient"
    - "patients"
    - "human"
    - "care"
    - "health"
    - "healthcare"
    - "community"
    - "communities"
    - "population"
    - "populations"
    - "individual"
    - "individuals"
    - "family"
    - "families"
    - "provider"
    - "providers"
    - "workforce"
    # ── Action verbs (generic grant language) ──
    - "improving"
    - "improvement"
    - "advancing"
    - "promoting"
    - "reducing"
    - "preventing"
    - "prevention"
    - "addressing"
    - "enhancing"
    - "strengthening"
    - "increasing"
    - "decreasing"
    - "developing"
    - "utilizing"
    - "applying"
    - "using"
    - "based"
    # ── Outcome / quality terms ──
    - "outcomes"
    - "quality"
    - "effectiveness"
    - "excellence"
    - "innovative"
    - "innovation"
    - "innovations"
    - "integrated"
    - "translational"
    - "collaborative"
    - "collaboration"
    # ── Disease / treatment (too broad alone — specific diseases kept via phrases) ──
    - "disease"
    - "treatment"
    - "conditions"
    - "chronic"
    - "education"
    - "training"
    - "intervention"
    - "interventions"
    # ── Admin / delivery ──
    - "service"
    - "services"
    - "delivery"
    - "access"
    - "equity"
    - "disparities"
    - "capacity"
    - "building"
    - "system"
    - "systems"
    - "practice"
    - "practices"
    - "policy"
    - "policies"
    - "management"
    - "implementation"
    - "development"
    - "precision"
    - "writing"
    # ── Developmental (standalone too generic) ──
    - "developmental"
    # ── 2026-05-28 additions — data-driven (top noise drivers from the 2026-05-28
    #    digest) + user-flagged generics + preemptive. Phrase-level safety: a
    #    multi-word keyword is only dropped if EVERY token is a stop, so
    #    "clinical trial", "brain injury", "early-stage cancer", "machine learning",
    #    "novel therapeutics", "cancer informatics" all survive.
    - "single"
    - "basic"
    - "mathematics"
    - "current"
    - "centered"
    - "mechanisms"
    - "imaging"          # phrase-safe: "MRI imaging", "molecular imaging" survive
    - "comparative"      # accepted risk: "comparative effectiveness" becomes all-stops
    - "defense"          # matches "Department of Defense" in DoD grant text
    - "trial"            # "clinical trial" survives (clinical is not a stop)
    - "trials"
    - "fellowship"
    - "cycle"
    - "discovery"        # "drug discovery" survives
    - "early"
    - "stage"
    - "through"          # preposition; literal noise
    - "diseases"         # plural of "disease" which was already a stop
    - "disorder"
    - "post"
    - "related"
    - "strategies"
    - "multiple"
    - "technologies"
    - "department"
    - "complex"
    - "small"
    - "specific"
    - "advanced"
    - "address"          # complements "addressing" already in list
    - "required"
    - "investigator"
    - "coordinating"
    - "leadership"
    - "peer"
    - "virtual"
    - "learning"         # accepted risk: "machine learning" still keeps "machine"
    - "novel"
    - "informatics"      # "cancer informatics" survives (cancer not a stop)
    # ── 2026-08-04 additions (10-day diag review) ──
    - "white"            # proper-noun leak: "Ryan White HIV/AIDS Program" matched
                         # faculty on the bare token 'white' (48-62% conf, 08-01).
                         # Phrase-safe: "white matter" survives the phrase-level check.
    # -- 2026-08-28 addition (08-25..08-27 diag review) --
    - "other"            # not a research topic at all - a profile-form artefact.
                         # Delivered a Medicine faculty onto the USDA "Capacity
                         # Building Grants for Non-Land-Grant Colleges of
                         # Agriculture" call at 56% on "educational, other".
    # -- 2026-08-22 addition (08-11..08-22 diag review) --
    - "special emphasis" # pure funding-announcement boilerplate ("areas of special
                         # emphasis"), never a research topic. Delivered a Medicine
                         # faculty onto the USDA "Agriculture Risk Management
                         # Education" call at 66% on this term alone. Stop-worded
                         # rather than context-dependent: it should never anchor a
                         # match, and it adds nothing when it co-occurs either.

# --- Logging ---
logging:
  level: "INFO"                          # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/grant_matcher.log"
  max_log_size_mb: 10
  backup_count: 3

# --- NIH RePORTER & Federal RePORTER APIs ---
nih_reporter:
  enabled: false                           # DISABLED: Returns awarded projects, not open opportunities
  federal_reporter_enabled: false          # DISABLED: Returns awarded projects, not open opportunities
  max_results_per_check: 100               # Max results per API call

# --- External Grant Sources (Foundations, Portals, Listing Services) ---
# All sources are enabled by default. To disable specific ones, add them
# to disabled_sources. Or set enabled_sources to only run a specific subset.
external_sources:
  enabled: true
  # Advisory health tier: a source that was healthy before but has produced no
  # NEW grant in this many days is flagged "quiet_stale" in the diagnostic (link
  # patterns may have silently stopped matching the source's current page). Set
  # high enough that genuinely-rare funders (e.g. Macy, ~1-3 RFAs/yr) don't spam.
  quiet_stale_days: 60
  # Broken health tier: a source that reaches no grant-like content for this many
  # consecutive runs is flagged "likely_broken" (page JS-rendered or structure
  # changed). consecutive_zeros only climbs on not-reached runs, so ~7 = a week of
  # daily runs with nothing found. Independent of last_success on purpose.
  likely_broken_runs: 7
  # Sources confirmed to have NEVER returned a result (their pages are
  # JavaScript-rendered or their structure changed, so requests-based scraping
  # gets an empty shell). Disabled to cut ~36s of dead runtime per cycle and
  # de-noise the scraper-health report. Re-enable individually if a working
  # scraper is implemented (e.g. via a headless browser or an official API/feed).
  disabled_sources:
    # nih_guide: NIH Guide RSS (fundingopps.xml) is reachable locally but
    # consistently unreachable from the Azure container (5 consecutive zero-runs,
    # "never reachable" per the scraper-health tracker). NIH funding opportunities
    # are already covered by Grants.gov, so this is a no-loss disable; clears the
    # likely_broken alert noise from the diagnostic. (2026-05-28.)
    - "nih_guide"
    # czi: two compounding failures. (1) chanzuckerberg.com is reachable from a
    # normal client but the Azure container's cloud IP gets a blocked/shell
    # response (0 links since ~2026-07-03, likely_broken). (2) Even fetched, CZI
    # redesigned /science/science-funding/ so RFA titles moved out of the link
    # text into "RFA Details" buttons/image cards — the generic scraper extracts
    # 0. Fixing both needs a bespoke slug-based scraper for a low-volume funder
    # (~handful of RFAs/yr, mostly already-known), so disabled. Re-enable only
    # with a dedicated extractor + UA override if CZI coverage becomes a priority.
    # (2026-07-10.)
    - "czi"
    - "pnd_rfps"
    - "dod_cdmrp"
    - "burroughs_wellcome"
    - "hhmi"
    - "damon_runyon"
    - "doris_duke"
    - "rwjf"
    - "keck"
    - "beckman"
    - "march_of_dimes"
    - "gates"
    - "wellcome_trust"
    - "koch_foundation"
    - "yield_giving"
    - "science_philanthropy_alliance"
    - "ucla_dgsom"
    - "miami_miller"
    - "aamc_grants"
    # stanford_rmg scrapes Stanford's internal research-admin site (process pages
    # like "Budget Development", "Subaward Closeout") — not a funding source.
    - "stanford_rmg"
    # 2026-08-04 (10-day diag review): all three below hit 77 consecutive
    # zero-content runs since 2026-05-25 with last_reachable=null — same
    # JS-rendered/blocked failure mode as czi. Disabled per the czi precedent;
    # re-enable individually only if a headless/bespoke scraper is built.
    - "alexs_lemonade"
    - "alzheimers_assoc"
    - "proposal_central"
    # aha: American Heart Association put Cloudflare bot management in front of
    # the WHOLE heart.org domain around 2026-08-19. This is not a broken
    # selector — every host and path 403s identically, robots.txt included:
    #
    #   professional.heart.org/en/research-programs   403  server=cloudflare
    #   www.heart.org/                                403  server=cloudflare
    #   professional.heart.org/robots.txt             403  server=cloudflare
    #   <title>Attention Required! | Cloudflare</title> / "you have been blocked"
    #
    # It is a deliberate client-level access control by the site owner, and our
    # self-identifying UA (UMSOMGrantMatcher/1.0) is what it is configured to
    # stop. Do NOT "fix" this by spoofing a browser User-Agent, driving a
    # headless browser through the JS challenge, or proxying — all three are
    # evasion of that control, not a scraper fix. The UA swap in particular is a
    # two-line change that looks like a fix and is not; it is called out here so
    # it does not get done later by accident.
    #
    # No legitimate substitute exists. AHA runs its applications through
    # ProposalCentral, but proposalcentral.com/GrantOpportunities.asp is a
    # JS-rendered marketing shell (0 tables, 0 opportunity rows, 0 AHA links) and
    # proposal_central is already disabled above for that same reason. The AHA
    # newsroom RSS fetches fine but carries no funding content.
    #
    # Low-cost disable: AHA produced 8 grants total across the archive and its
    # last new one was 2026-06-18 — two months BEFORE the block began — so this
    # source had already gone quiet. Clears a standing likely_broken alert (12
    # consecutive zero-reach runs as of 08-31) and one dead fetch per cycle.
    #
    # The only route that restores coverage is asking AHA to allowlist the
    # matcher by UA string or by the Azure app's egress IP. If that is ever
    # granted, re-enable this key — the existing scraper needs no code change,
    # since the 403 is the only failure. (2026-09-01.)
    - "aha"
